name: Validate Ultra Q2 H3 Backend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-h3-ultra.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python kaggle/test_ultra_gguf.py
