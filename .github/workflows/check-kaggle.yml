name: Check Kaggle H3 Render

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-kaggle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q "kaggle>=2.2" requests
      - name: Check Kaggle status without restarting GPU job
        env:
          SHIPIN_KAGGLE_CREDENTIAL: ${{ secrets.shipin }}
        run: python -u kaggle/check_status.py
