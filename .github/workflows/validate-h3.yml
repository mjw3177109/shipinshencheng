name: Validate MiniMax H3 Compact Profiles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-h3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate three H3 workflows and model profiles
        run: python kaggle/test_model_profiles.py
